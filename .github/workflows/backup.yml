name: Weekly backup

on:
  workflow_dispatch:
  schedule:
    - cron: "17 10 * * 0"

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python3 backup.py
        env:
          SUPABASE_SECRET: ${{ secrets.SUPABASE_SECRET }}
      - name: Encrypt
        env:
          BACKUP_PASSWORD: ${{ secrets.BACKUP_PASSWORD }}
        run: |
          test -n "$BACKUP_PASSWORD" || { echo "BACKUP_PASSWORD secret missing"; exit 1; }
          openssl enc -aes-256-cbc -pbkdf2 -salt -in backup.tar.gz -out backup.tar.gz.enc -pass env:BACKUP_PASSWORD
          rm -rf backup backup.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: laloo-backup-${{ github.run_number }}
          path: backup.tar.gz.enc
          retention-days: 90
      - name: Report run to Mr. Space
        if: always()
        env:
          SUPABASE_SECRET: ${{ secrets.SUPABASE_SECRET }}
          LALOO_LOG_KEY: ${{ secrets.LALOO_LOG_KEY }}
          JOB_OK: ${{ job.status == 'success' }}
          JOB_NAME: ${{ github.workflow }}
          SUMMARY: run ${{ github.run_number }} (${{ github.event_name }})
        run: |
          [ -n "$LALOO_LOG_KEY" ] || { echo "LALOO_LOG_KEY secret missing, skipping"; exit 0; }
          body=$(jq -nc --arg k "$LALOO_LOG_KEY" --arg j "$JOB_NAME" --argjson ok "$JOB_OK" --arg s "$SUMMARY" '{p_key:$k,p_job:$j,p_ok:$ok,p_summary:$s}')
          curl -sS -m 20 -X POST "https://tizfdnsjhhepxnqqrzuk.supabase.co/rest/v1/rpc/ms_job_ping" \
            -H "apikey: $SUPABASE_SECRET" -H "Content-Type: application/json" -d "$body" || true
